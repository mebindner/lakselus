<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/deck.gl@9.1.14/dist.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  :root { --creme: #FFFFFF; --rav: #F26B4F; --laks: #F26B4F; --nat: #0B2230; --daempet: #9FB2C0; }
  html, body { margin: 0; height: 100%; background: var(--nat); font-family: 'Inter', sans-serif; color: var(--creme); overflow: hidden; }
  #kort { position: absolute; inset: 0; border-radius: 10px; overflow: hidden;
          background: radial-gradient(ellipse at 55% 25%, #16384C 0%, #0D2635 55%, #081A25 100%); }
  .lag { position: absolute; pointer-events: none; }
  #titel { left: 24px; top: 20px; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  #uge { font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  #maaned { font-size: 12px; font-weight: 600; color: var(--laks); margin-top: 8px; text-transform: uppercase; letter-spacing: .16em; }
  #snit { margin-top: 14px; font-size: 14px; opacity: .92; }
  #snit { color: var(--daempet); }
  #snit b { font-size: 22px; color: #FFFFFF; font-variant-numeric: tabular-nums; }
  #forklaring { right: 22px; top: 22px; background: rgba(8,26,37,.78); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.08);
                padding: 10px 14px; border-radius: 8px; color: var(--daempet); font-size: 12px; line-height: 1.5; }
  #forklaring .skala { width: 170px; height: 9px; border-radius: 5px; margin: 6px 0 3px;
                       background: linear-gradient(90deg, #1F7A8C, #5FA8A0 20%, #E2A23B 40%, #F26B4F 70%, #D64545); }
  #forklaring .ticks { display: flex; justify-content: space-between; opacity: .75; }
  #panel { left: 18px; right: 18px; bottom: 18px; pointer-events: auto; background: rgba(8,26,37,.85);
           backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; padding: 10px 16px 12px; }
  #graf { width: 100%; height: 54px; display: block; cursor: pointer; }
  .styring { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  button { background: var(--laks); color: white; border: 0; width: 38px; height: 38px; border-radius: 6px;
           font-size: 15px; cursor: pointer; flex: none; }
  button:hover { filter: brightness(1.1); }
  input[type=range] { flex: 1; accent-color: var(--laks); }
  select { background: transparent; color: var(--creme); border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 4px 6px; }
  .aar { position: relative; height: 15px; font-size: 11px; opacity: .6; }
  .aar span { position: absolute; top: 0; padding-left: 3px; border-left: 1px solid rgba(255,255,255,.35); line-height: 1; }
  #kilde { right: 22px; bottom: 150px; font-size: 10px; opacity: .55; }
  .deck-tooltip { font-family: 'Inter', sans-serif !important; border-radius: 8px; }
  #kontrol { right: 22px; top: 132px; pointer-events: auto; display: flex; flex-direction: column; gap: 6px; }
  #kontrol button { width: 34px; height: 34px; font-size: 16px; font-weight: 600; color: #FFFFFF;
                    background: rgba(8,26,37,.82); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.14); }
  #kontrol button:hover { background: rgba(242,107,79,.9); filter: none; }
  #kontrol #knap3d { font-size: 11px; letter-spacing: .02em; }
  .touch { display: none; }
  @media (hover: none) { .mus { display: none; } .touch { display: inline; } }
  /* Smal skærm (mobil): forklaringen flyttes ned over tidslinjen, så den ikke dækker ugenummeret */
  @media (max-width: 600px) {
    #titel { left: 16px; top: 14px; }
    #uge { font-size: 30px; }
    #snit { margin-top: 8px; font-size: 13px; }
    #snit b { font-size: 18px; }
    #forklaring { right: auto; left: 16px; top: auto; bottom: 148px; padding: 7px 10px; font-size: 11px; }
    #forklaring .skala { width: 140px; }
    #kilde { display: none; }
    #kontrol { right: 12px; top: 14px; }
    #panel { left: 10px; right: 10px; bottom: 10px; padding: 8px 10px 10px; }
    .aar { font-size: 10px; }
  }
</style>
</head>
<body>
<div id="kort"></div>

<div id="titel" class="lag">
  <div id="uge">Week –</div>
  <div id="maaned"></div>
  <div id="snit">Coast-wide average <b id="snittal">–</b></div>
</div>

<div id="forklaring" class="lag">
  <b style="color:#fff">Adult female lice per fish</b>
  <div class="skala"></div>
  <div class="ticks"><span>0</span><span>0.2</span><span>0.5</span><span>1+</span></div>
  <div style="margin-top:6px;opacity:.75"><span class="mus">Drag to pan · buttons or right-click + drag to rotate</span><span class="touch">Drag to pan · buttons or two fingers to rotate</span></div>
</div>

<div id="kilde" class="lag">Coastline: Natural Earth</div>

<div id="kontrol" class="lag">
  <button id="drejV" title="Rotate left" aria-label="Rotate left">↺</button>
  <button id="drejH" title="Rotate right" aria-label="Rotate right">↻</button>
  <button id="knap3d" title="Switch between flat and 3D view" aria-label="Toggle 2D/3D">2D</button>
  <button id="nulstil" title="Reset view" aria-label="Reset view">⌂</button>
</div>

<div id="panel" class="lag">
  <canvas id="graf"></canvas>
  <div class="aar" id="aarstal"></div>
  <div class="styring">
    <button id="spil" title="Play / pause">❚❚</button>
    <input id="skyder" type="range" min="0" value="0" step="1">
    <select id="fart" title="Speed">
      <option value="420">0.5×</option><option value="220" selected>1×</option>
      <option value="110">2×</option><option value="55">4×</option>
    </select>
  </div>
</div>

<script>
const D = __DATA__;
const N = D.lok.length, U = D.uger.length;
const V = Uint8Array.from(atob(D.vaerdier), c => c.charCodeAt(0));
const MANGLER = 255;
const lok = D.lok.map((l, i) => ({ i, pos: [l[0], l[1]], navn: l[2] }));
// Pause/afspil-ikoner
const PAUSE = "❚❚", AFSPIL = "▶";
const MAANED = { Jan: "January", Feb: "February", Mar: "March", Apr: "April", May: "May", Jun: "June",
                 Jul: "July", Aug: "August", Sep: "September", Oct: "October", Nov: "November", Dec: "December" };

// Farveskala: blågrøn (lavt) → rav → laks → dyb rød (over grænsen)
const STOP = [[0, [31,122,140]], [0.1, [95,168,160]], [0.2, [226,162,59]], [0.5, [242,107,79]], [1.0, [214,69,69]]];
function farve(v) {
  if (v >= STOP[STOP.length - 1][0]) return STOP[STOP.length - 1][1];
  for (let k = 1; k < STOP.length; k++) {
    const [x1, c1] = STOP[k], [x0, c0] = STOP[k - 1];
    if (v <= x1) { const t = (v - x0) / (x1 - x0); return c0.map((c, j) => Math.round(c + t * (c1[j] - c))); }
  }
}
const tal = (v, d = 2) => v.toFixed(d);

let uge = 0, spiller = true, timer = null;

// Baggrund: stiliseret land fra Natural Earth (world-atlas), tegnet af deck.gl – ingen kortnøgle nødvendig.
let baggrund = null;
fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json")
  .then(r => r.json())
  .then(topo => {
    baggrund = new deck.GeoJsonLayer({
      id: "land",
      // Kun nabolande – Ruslands polygon krydser datolinjen og giver en streg over himlen.
      data: topojson.feature(topo, topo.objects.countries).features
        .filter(f => ["Norway", "Sweden", "Finland", "Denmark", "Estonia", "Latvia", "Iceland", "United Kingdom", "Germany"].includes(f.properties.name)),
      filled: true, stroked: true, getFillColor: [22, 52, 70], getLineColor: [120, 160, 185, 90],
      lineWidthMinPixels: 0.6,
    });
    kort.setProps({ layers: lag() });
  });

// På en smal (stående) skærm vises hele kysten lige op og ned; ellers skråt fra sydvest.
const START = innerWidth < 600
  ? { longitude: 14.6, latitude: 64.4, zoom: 3.05, pitch: 35, bearing: 0, maxPitch: 75 }
  : { longitude: 14.0, latitude: 64.2, zoom: 3.95, pitch: 46, bearing: 12, maxPitch: 75 };
let visning = START;

const kort = new deck.Deck({
  parent: document.getElementById("kort"),
  initialViewState: START,
  controller: { scrollZoom: false, touchRotate: true },
  onViewStateChange: ({ viewState }) => { visning = viewState; opdaterKnap(); },
  // Rører brugeren selv kortet, stopper kamerasvinget, så det ikke tager kameraet tilbage.
  onInteractionStateChange: s => { if (s.isDragging || s.isPanning || s.isRotating || s.isZooming) stopSving(); },
});

// --- Kortknapper: drej, 2D/3D og nulstil – så det er tydeligt, at kortet er 3D ----------
const glid = new deck.LinearInterpolator(["longitude", "latitude", "zoom", "pitch", "bearing"]);
function flyt(aendring, ms = 700, easing = t => t) {
  visning = { ...visning, ...aendring };
  kort.setProps({ initialViewState: { ...visning, transitionDuration: ms, transitionInterpolator: glid, transitionEasing: easing } });
  opdaterKnap();
}

// --- Kamerasving ved start: kameraet glider roligt ned i en lav vinkel over Vestlandet og tilbage ----
// Viser, at kortet er 3D, og at søjlerne har højde. Én gang pr. visning; springes over ved "reduceret bevægelse".
const SVING = innerWidth < 600
  ? { longitude: 8.0, latitude: 61.6, zoom: 4.0, pitch: 60, bearing: -8 }
  : { longitude: 7.0, latitude: 61.8, zoom: 4.7, pitch: 62, bearing: -10 };
const blid = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let svingTimere = [];
function stopSving() { svingTimere.forEach(clearTimeout); svingTimere = []; }
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  svingTimere = [
    setTimeout(() => flyt(SVING, 6000, blid), 3000),
    setTimeout(() => { svingTimere = []; flyt(START, 6000, blid); }, 3000 + 6000 + 3000),
  ];
}
const knap3d = document.getElementById("knap3d");
function opdaterKnap() { knap3d.textContent = visning.pitch > 5 ? "2D" : "3D"; }
document.getElementById("drejV").addEventListener("click", () => { stopSving(); flyt({ bearing: visning.bearing - 30 }); });
document.getElementById("drejH").addEventListener("click", () => { stopSving(); flyt({ bearing: visning.bearing + 30 }); });
knap3d.addEventListener("click", () => { stopSving(); flyt({ pitch: visning.pitch > 5 ? 0 : START.pitch }); });
document.getElementById("nulstil").addEventListener("click", () => { stopSving(); flyt(START); });

function lag() {
  const base = uge * N, fart = +document.getElementById("fart").value;
  return [baggrund, new deck.ColumnLayer({
    id: "lus", data: lok, diskResolution: 12, radius: 3400, extruded: true, pickable: true,
    getPosition: d => d.pos,
    getElevation: d => { const v = V[base + d.i]; return v === MANGLER ? 0 : Math.min(v, 200) * 1300; },
    getFillColor: d => { const v = V[base + d.i]; return v === MANGLER ? [0,0,0,0] : [...farve(v / 100), 235]; },
    material: { ambient: 0.6, diffuse: 0.55, shininess: 24, specularColor: [220, 230, 240] },
    transitions: { getElevation: { duration: Math.min(fart * 0.9, 400) }, getFillColor: { duration: Math.min(fart * 0.9, 400) } },
    updateTriggers: { getElevation: uge, getFillColor: uge },
  })];
}

kort.setProps({
  getTooltip: ({ object }) => {
    if (!object) return null;
    const v = V[uge * N + object.i];
    return { html: `<b>${object.navn}</b><br>${v === MANGLER ? "no count" : tal(v / 100) + " adult female lice per fish"}`,
             style: { background: "#0B2230", color: "#FFFFFF", fontSize: "12px", padding: "8px 10px", border: "1px solid rgba(255,255,255,.12)" } };
  },
});

// --- Mini-graf over kystens gennemsnit ---------------------------------------
const graf = document.getElementById("graf"), g = graf.getContext("2d");
const maks = Math.max(...D.national.filter(v => v != null));
function tegnGraf() {
  const dpr = window.devicePixelRatio || 1, w = graf.clientWidth, h = graf.clientHeight;
  graf.width = w * dpr; graf.height = h * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const x = i => (i / (U - 1)) * w, y = v => h - 4 - (v / maks) * (h - 10);
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "rgba(159,178,192,.35)"); grad.addColorStop(1, "rgba(159,178,192,0)");
  g.beginPath(); g.moveTo(0, h);
  D.national.forEach((v, i) => g.lineTo(x(i), v == null ? h : y(v)));
  g.lineTo(w, h); g.closePath(); g.fillStyle = grad; g.fill();
  g.beginPath(); D.national.forEach((v, i) => v != null && (i ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v))));
  g.strokeStyle = "#9FB2C0"; g.lineWidth = 1.2; g.stroke();
  g.fillStyle = "rgba(255,255,255,.05)"; g.fillRect(0, 0, x(uge), h);
  g.beginPath(); g.moveTo(x(uge), 0); g.lineTo(x(uge), h); g.strokeStyle = "#F26B4F"; g.lineWidth = 1.5; g.stroke();
  const v = D.national[uge];
  if (v != null) { g.beginPath(); g.arc(x(uge), y(v), 4.5, 0, 7); g.fillStyle = "#F26B4F"; g.fill(); }
}
graf.addEventListener("click", e => { saetUge(Math.round(e.offsetX / graf.clientWidth * (U - 1))); });

const aar = [...new Set(D.uger.map(u => u[0]))];
// Hvert årstal står ved årets første uge på kurven (samme x-skala som grafen).
document.getElementById("aarstal").innerHTML = aar
  .map(a => [a, D.uger.findIndex(u => u[0] === a)])
  .filter(([, i]) => i / (U - 1) < 0.97)
  .map(([a, i]) => `<span style="left:${(i / (U - 1) * 100).toFixed(2)}%">${a}</span>`).join("");

// --- Styring ------------------------------------------------------------------
const skyder = document.getElementById("skyder"), knap = document.getElementById("spil");
skyder.max = U - 1;

function saetUge(i) {
  uge = Math.max(0, Math.min(U - 1, i));
  skyder.value = uge;
  const [a, u, m] = D.uger[uge];
  document.getElementById("uge").textContent = `Week ${u} · ${a}`;
  document.getElementById("maaned").textContent = MAANED[m] || m;
  const v = D.national[uge];
  document.getElementById("snittal").textContent = v == null ? "–" : tal(v);
  kort.setProps({ layers: lag() });
  tegnGraf();
}

function start() {
  clearInterval(timer);
  timer = setInterval(() => {
    if (uge >= U - 1) { pause(); return; }
    saetUge(uge + 1);
  }, +document.getElementById("fart").value);
  spiller = true; knap.textContent = "❚❚";
}
function pause() { clearInterval(timer); spiller = false; knap.textContent = "▶"; }

knap.addEventListener("click", () => {
  if (spiller) return pause();
  if (uge >= U - 1) saetUge(0);
  start();
});
skyder.addEventListener("input", () => { pause(); saetUge(+skyder.value); });
document.getElementById("fart").addEventListener("change", () => { if (spiller) start(); });
window.addEventListener("resize", tegnGraf);

saetUge(0);
start();
</script>
</body>
</html>
