# Henter nye lusetal og lusebehandlinger hver uge, genberegner modellerne og publicerer app-data.
# Et push til main får Streamlit Community Cloud til at opdatere den offentlige side.
# Kræver repository-secrets BW_CLIENT_ID og BW_CLIENT_SECRET (Settings → Secrets and variables → Actions).
name: Ugentlig opdatering

on:
  schedule:
    # Opdrætterne indberetter senest tirsdag; onsdag nat er over 95 % af sidste uge kommet ind.
    # GitHub kan forsinke planlagte kørsler med timer (især på hele klokkeslæt), så der er tre forsøg
    # natten til onsdag. Det første, der lykkes, opdaterer; de næste ser det og springer over.
    - cron: "17 0 * * 3"   # 00:17 UTC = 01:17 dansk vintertid
    - cron: "47 2 * * 3"   # reserve
    - cron: "17 4 * * 3"   # reserve
  workflow_dispatch:       # kan også startes manuelt fra fanen Actions

permissions:
  contents: write

concurrency:
  group: ugentlig-opdatering
  cancel-in-progress: false

jobs:
  opdater:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
      BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20   # nok historik til at se, om dagens opdatering allerede er lavet

      - name: Tjek API-nøglen, og om en tidligere kørsel i dag allerede har opdateret
        id: noegle
        run: |
          if [ -z "$BW_CLIENT_ID" ] || [ -z "$BW_CLIENT_SECRET" ]; then
            echo "::notice::BW_CLIENT_ID/BW_CLIENT_SECRET mangler som repository-secrets – springer opdateringen over."
            echo "klar=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && \
               git log --since="$(date -u +%Y-%m-%d)T00:00:00Z" --format=%s -- data/app | grep -q "^Weekly update"; then
            echo "::notice::Dagens opdatering er allerede lavet af en tidligere kørsel – springer over."
            echo "klar=false" >> "$GITHUB_OUTPUT"
          else
            echo "klar=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.noegle.outputs.klar == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installér
        if: steps.noegle.outputs.klar == 'true'
        run: pip install -e . pytest

      - name: Hent nye lusetal og behandlinger fra BarentsWatch
        if: steps.noegle.outputs.klar == 'true'
        run: python -m lakselus.hent --fra 2019

      - name: Genberegn modeller og publicér app-data
        if: steps.noegle.outputs.klar == 'true'
        run: |
          python -m lakselus.modelrapport
          python -m lakselus.publicer

      - name: Kvalitetsport – alle tests skal bestå, før noget pushes
        if: steps.noegle.outputs.klar == 'true'
        run: pytest -q

      - name: Commit og push, hvis data er ændret
        if: steps.noegle.outputs.klar == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/app
          if git diff --cached --quiet; then
            echo "Ingen nye data."
          else
            git commit -m "Weekly update of lice counts, treatments and models ($(date -u +%Y-%m-%d))"
            # Er der pushet kode imens, lægges dataopdateringen oven på i stedet for at fejle.
            git pull --rebase origin main
            git push
          fi
